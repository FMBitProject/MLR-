services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
      POSTGRES_DB: mlr
    volumes:
      - mlr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlr -d mlr"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Production startup applies migrations only. Demo data is opt-in, local only.
  migrate:
    build:
      context: ./app
      target: build
    environment:
      DATABASE_URL: postgres://mlr:${POSTGRES_PASSWORD:?Set a strong database password}@postgres:5432/mlr
      NODE_ENV: production
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy

  mlr-flow:
    build: ./app
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://mlr:${POSTGRES_PASSWORD:?Set a strong database password}@postgres:5432/mlr
      # Uploaded files are stored inline in Postgres (default "db" driver) —
      # persisted in the mlr-pgdata volume above, no separate volume needed.
      # Ganti dengan secret acak Anda sendiri di produksi:
      #   openssl rand -hex 32
      AUTH_SECRET: ${AUTH_SECRET:?Generate a random AUTH_SECRET with openssl rand -hex 32}
      APP_URL: https://${APP_HOST:?Set the public hostname for HTTPS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Intellibase MLR Flow <onboarding@resend.dev>}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Opsional — isi salah satu untuk mengaktifkan penilaian AI.
      # GROQ_API_KEY gratis (console.groq.com); provider terdeteksi otomatis.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  https:
    image: caddy:2-alpine
    environment:
      APP_HOST: ${APP_HOST:?Set the public hostname for HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mlr-flow
    restart: unless-stopped

volumes:
  mlr-pgdata:
  caddy-data:
  caddy-config:
